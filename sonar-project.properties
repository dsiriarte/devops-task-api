# Configuracion del analisis estatico de SonarQube.
#
# El escaner lee este archivo desde la raiz del repositorio, de modo que el
# analisis se ejecuta igual en la maquina de un desarrollador y en el pipeline,
# sin parametros dispersos en la configuracion de CI.

sonar.projectKey=devops-task-api
sonar.projectName=DevOps Task API
sonar.projectVersion=1.1.0

# Codigo que se analiza y codigo que se excluye del analisis principal.
sonar.sources=src,scripts
sonar.tests=tests
sonar.exclusions=node_modules/**,coverage/**,docs/**,public/**

# Informe de cobertura producido por Jest en formato LCOV. Sin esta linea
# SonarQube reportaria 0% de cobertura aunque las pruebas existan.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
