<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DevOps Task API</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --fg:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --ok:#4ade80; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
    .wrap { max-width: 720px; margin: 0 auto; padding: 2rem 1rem 4rem; }
    h1 { font-size: 1.6rem; margin: 0 0 .25rem; }
    p.sub { color: var(--muted); margin: 0 0 2rem; font-size: .95rem; }
    .stats { display:flex; gap:.75rem; margin-bottom:1.5rem; flex-wrap:wrap; }
    .stat { background:var(--card); border-radius:10px; padding:.85rem 1.1rem; flex:1; min-width:110px; }
    .stat b { display:block; font-size:1.5rem; color:var(--accent); }
    .stat span { font-size:.78rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
    form { display:flex; gap:.5rem; margin-bottom:1.25rem; }
    input { flex:1; padding:.7rem .9rem; border-radius:8px; border:1px solid #334155; background:var(--card); color:var(--fg); }
    button { padding:.7rem 1.1rem; border-radius:8px; border:0; background:var(--accent); color:#0f172a; font-weight:600; cursor:pointer; }
    ul { list-style:none; padding:0; margin:0; }
    li { background:var(--card); border-radius:10px; padding:.8rem 1rem; margin-bottom:.6rem; display:flex; align-items:center; gap:.75rem; }
    li.done .title { text-decoration: line-through; color: var(--muted); }
    .title { flex:1; }
    .btn-sm { background:transparent; color:var(--muted); border:1px solid #334155; font-weight:500; padding:.35rem .7rem; font-size:.8rem; }
    .btn-sm.ok { color: var(--ok); border-color:#166534; }
    footer { margin-top:2.5rem; color:var(--muted); font-size:.8rem; text-align:center; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>DevOps Task API</h1>
    <p class="sub">Aplicacion web de ejemplo del laboratorio CI/CD &middot; Fundamentos DevOps</p>

    <div class="stats">
      <div class="stat"><b id="s-total">0</b><span>Total</span></div>
      <div class="stat"><b id="s-pending">0</b><span>Pendientes</span></div>
      <div class="stat"><b id="s-done">0</b><span>Completadas</span></div>
      <div class="stat"><b id="s-rate">0%</b><span>Avance</span></div>
    </div>

    <form id="form">
      <input id="title" placeholder="Nueva tarea..." maxlength="120" required />
      <button type="submit">Agregar</button>
    </form>

    <ul id="list"></ul>
    <footer>version <span id="ver">-</span> &middot; commit <span id="commit">-</span></footer>
  </div>

  <script>
    const api = (path, opts) => fetch('/api' + path, opts).then((r) => (r.status === 204 ? null : r.json()));

    async function render() {
      const { data: tasks } = await api('/tasks');
      const { data: stats } = await api('/stats');

      document.getElementById('s-total').textContent = stats.total;
      document.getElementById('s-pending').textContent = stats.pending;
      document.getElementById('s-done').textContent = stats.done;
      document.getElementById('s-rate').textContent = stats.completionRate + '%';

      const list = document.getElementById('list');
      list.innerHTML = '';
      tasks.forEach((t) => {
        const li = document.createElement('li');
        li.className = t.status === 'done' ? 'done' : '';
        const span = document.createElement('span');
        span.className = 'title';
        span.textContent = t.title;
        li.appendChild(span);

        if (t.status !== 'done') {
          const ok = document.createElement('button');
          ok.className = 'btn-sm ok';
          ok.textContent = 'Completar';
          ok.onclick = async () => { await api('/tasks/' + t.id + '/complete', { method: 'PATCH' }); render(); };
          li.appendChild(ok);
        }

        const del = document.createElement('button');
        del.className = 'btn-sm';
        del.textContent = 'Eliminar';
        del.onclick = async () => { await api('/tasks/' + t.id, { method: 'DELETE' }); render(); };
        li.appendChild(del);

        list.appendChild(li);
      });
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('title');
      if (!input.value.trim()) return;
      await api('/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: input.value }),
      });
      input.value = '';
      render();
    });

    fetch('/version').then((r) => r.json()).then((v) => {
      document.getElementById('ver').textContent = v.version;
      document.getElementById('commit').textContent = String(v.commit).slice(0, 7);
    });

    render();
  </script>
</body>
</html>
