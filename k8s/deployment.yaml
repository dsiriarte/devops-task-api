apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-task-api
  namespace: devops-lab
  labels:
    app: devops-task-api
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: devops-task-api
  strategy:
    # Actualizacion progresiva: se sustituyen los pods de a uno, sin
    # interrupcion del servicio, y con posibilidad de rollback automatico.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: devops-task-api
      annotations:
        # Permite que Prometheus descubra y raspe las metricas del pod.
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3000'
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: devops-task-api
          # El pipeline de CD reemplaza esta etiqueta por la version publicada.
          image: devops-task-api:1.1.1
          # La imagen se construye en el demonio local del cluster, por lo que
          # no debe intentar descargarse de un registro remoto.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '3000'
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          # Liveness: si deja de responder, Kubernetes reinicia el contenedor.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          # Readiness: no recibe trafico hasta estar listo (clave en rolling update).
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
